<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カンナダ語学習</title>
<style>
  :root {
    --maroon: #6B1A1A;
    --maroon-dark: #4A1010;
    --maroon-light: #8B2A2A;
    --gold: #C9A84C;
    --gold-light: #E2C97E;
    --bg: #1A0A0A;
    --card-bg: #2A1010;
    --text: #F5ECD7;
    --text-dim: #B8A898;
    --green: #4CAF50;
    --red: #E57373;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header {
    background: var(--maroon-dark);
    border-bottom: 2px solid var(--gold);
    padding: 12px 16px;
    text-align: center;
  }
  header h1 { font-size: 1.3rem; color: var(--gold); letter-spacing: 0.05em; }
  header p { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

  /* Progress */
  .progress-wrap { padding: 10px 16px 0; }
  .progress-bar-bg {
    background: var(--maroon-dark);
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--maroon-light);
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    height: 100%;
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .progress-label { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; text-align: right; }

  /* Category tabs */
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--maroon-light);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab.active {
    background: var(--gold);
    color: var(--maroon-dark);
    border-color: var(--gold);
    font-weight: bold;
  }

  /* Card area */
  .card-area { padding: 0 16px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--maroon-light);
    border-radius: 12px;
    padding: 24px 20px 20px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .card:active { border-color: var(--gold); }
  .card .cat-badge {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 0.68rem;
    color: var(--gold);
    background: var(--maroon-dark);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--gold);
  }
  .card .score-dots {
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    gap: 3px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1px solid var(--maroon-light);
    background: transparent;
  }
  .dot.filled { background: var(--gold); border-color: var(--gold); }

  .card .ja { font-size: 1.3rem; font-weight: bold; color: var(--text); margin-bottom: 10px; }
  .card .tap-hint { font-size: 0.72rem; color: var(--text-dim); }

  /* Revealed state */
  .card .kata { font-size: 1.4rem; color: var(--gold-light); font-weight: bold; margin-bottom: 6px; }
  .card .kn { font-size: 1.2rem; color: var(--text-dim); margin-bottom: 10px; }
  .card .gr-tag {
    font-size: 0.72rem;
    background: var(--maroon-dark);
    color: var(--gold);
    padding: 3px 10px;
    border-radius: 10px;
    border: 1px solid var(--maroon-light);
    margin-bottom: 12px;
  }

  /* Word breakdown */
  .word-breakdown {
    width: 100%;
    margin-top: 10px;
    border-top: 1px solid var(--maroon-light);
    padding-top: 10px;
  }
  .word-breakdown h4 {
    font-size: 0.68rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-align: left;
  }
  .words-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .word-chip {
    background: var(--maroon-dark);
    border: 1px solid var(--maroon-light);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s;
    min-width: 60px;
  }
  .word-chip:hover, .word-chip.active { border-color: var(--gold); }
  .word-chip .wkata { font-size: 0.82rem; color: var(--gold-light); display: block; }
  .word-chip .wkn { font-size: 0.72rem; color: var(--text-dim); display: block; }

  /* Word gloss popup */
  .gloss-box {
    width: 100%;
    margin-top: 8px;
    background: var(--maroon-dark);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 8px 12px;
    text-align: left;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .gloss-box .gloss-pos {
    font-size: 0.68rem;
    color: var(--gold);
    margin-bottom: 3px;
  }
  .gloss-box .gloss-meaning { font-size: 0.82rem; color: var(--text); }

  /* Buttons */
  .buttons {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
  }
  .btn {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .btn-again { background: var(--maroon-light); color: var(--text); }
  .btn-got { background: var(--gold); color: var(--maroon-dark); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* Queue info */
  .queue-info { text-align: center; font-size: 0.72rem; color: var(--text-dim); padding: 4px 16px 10px; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .empty-state .big { font-size: 2.5rem; margin-bottom: 10px; }

  /* Conjugation table */
  .conj-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    margin-top: 10px;
  }
  .conj-table th {
    background: var(--maroon-dark);
    color: var(--gold);
    padding: 6px 8px;
    text-align: left;
    border-bottom: 1px solid var(--maroon-light);
  }
  .conj-table td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--maroon-dark);
    vertical-align: top;
  }
  .conj-table tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
  .conj-kata { color: var(--gold-light); font-size: 0.88rem; }
  .conj-kn { color: var(--text-dim); font-size: 0.75rem; }

  .section-card {
    background: var(--card-bg);
    border: 1px solid var(--maroon-light);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .section-card h3 { color: var(--gold); font-size: 0.92rem; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <h1>ಕನ್ನಡ — カンナダ語学習</h1>
  <p>タップしてカタカナ読みを確認 → 定着度を記録</p>

  // ── 追加フレーズ ──

    words:[

      {kata:"ギラ/ギルラ", kn:"ಇಲ್ಲ", pos:"否定不変化詞", gloss:"「ない」。パルワー+イルラ→「問題ない」。ネイティブはパルワーギラと短縮して発音"}
    ]
  }

// 動詞ಇರう活用一覧 (特別カテゴリ)
const IRRU_CONJ = [
  {person:"一人称(私)", kata:"イッディーニ / イッデーニ", kn:"ಇದ್ದೇನೆ", note:"ナーヌ イッデーニ (私はいる)"},
  {person:"二人称(あなた・丁寧)", kata:"イッディーラ / イッディーリ", kn:"ಇದ್ದೀರಾ", note:"ニーヴー イッディーラ (あなたはいますか?)"},
  {person:"二人称(タメ口)", kata:"イッダーニャ", kn:"ಇದ್ದಾನ", note:"ニーヌ イッダーニャ (お前はいるか?)"},
  {person:"三人称・男性", kata:"イッダーニャ", kn:"ಇದ್ದಾನೆ", note:"アワヌ イッダーニャ (彼はいる)"},
  {person:"三人称・女性", kata:"イッダーリェ", kn:"ಇದ್ದಾಳೆ", note:"アワル イッダーリェ (彼女はいる)"},
  {person:"三人称・尊敬/複数", kata:"イッダーレ", kn:"ಇದ್ದಾರೆ", note:"アワル イッダーレ (彼らはいる)"},
  {person:"命令形・丁寧", kata:"イリ", kn:"ಇರಿ", note:"スコンチャ イリ (少し待って)"},
];

// ─────────────────────────────────────────────
// STATE & STORAGE
// ─────────────────────────────────────────────
const STORAGE_KEY = 'kannada_progress_v1';
let progress = {}; // {id: score 0-5}
let currentCat = 'すべて';
let currentPhrase = null;
let revealed = false;
let activeWordIdx = null;

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) progress = JSON.parse(raw);
  } catch(e) {}
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch(e) {}
}

// ─────────────────────────────────────────────
// CATEGORIES
// ─────────────────────────────────────────────
const CATS = ['すべて', ...new Set(PHRASES.map(p => p.cat)), '動詞ಇರu活用'];

function buildTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  CATS.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c === currentCat ? ' active' : '');
    btn.textContent = c;
    btn.onclick = () => { currentCat = c; buildTabs(); updateProgress(); nextCard(); };
    el.appendChild(btn);
  });
}

// ─────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────
function updateProgress() {
  const phrases = filteredPhrases();
  if (currentCat === '動詞ಇರu活用') {
    document.getElementById('progressLabel').textContent = '動詞ಇರu活用一覧';
    document.getElementById('progressFill').style.width = '100%';
    return;
  }
  const mastered = phrases.filter(p => (progress[p.id] || 0) >= 5).length;
  const pct = phrases.length ? Math.round(mastered / phrases.length * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `定着済み ${mastered}/${phrases.length} (${pct}%)`;
}

// ─────────────────────────────────────────────
// PHRASE SELECTION (weighted)
// ─────────────────────────────────────────────
function filteredPhrases() {
  if (currentCat === 'すべて') return PHRASES;
  if (currentCat === '動詞ಇರu活用') return [];
  return PHRASES.filter(p => p.cat === currentCat);
}

function pickNextPhrase() {
  const pool = filteredPhrases();
  if (!pool.length) return null;
  const weights = pool.map(p => Math.max(1, 6 - (progress[p.id] || 0)));
  const total = weights.reduce((a, b) => a + b, 0);
  let rand = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    rand -= weights[i];
    if (rand <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderScoreDots(score) {
  let html = '<div class="score-dots">';
  for (let i = 0; i < 5; i++) {
    html += `<div class="dot${i < score ? ' filled' : ''}"></div>`;
  }
  return html + '</div>';
}

function renderConjugationTable() {
  document.getElementById('mainArea').innerHTML = `
    <div class="section-card">
      <h3>動詞 ಇರು (いる/ある) の人称活用</h3>
      <p style="font-size:0.75rem;color:var(--text-dim);margin-bottom:8px;">カンナダ語で最も重要な動詞。「お元気ですか?」「少し待って」など頻出します。</p>
      <table class="conj-table">
        <tr><th>人称</th><th>カタカナ / カンナダ文字</th><th>例文メモ</th></tr>
        ${IRRU_CONJ.map(r => `
          <tr>
            <td>${r.person}</td>
            <td><span class="conj-kata">${r.kata}</span><br><span class="conj-kn">${r.kn}</span></td>
            <td style="font-size:0.72rem;color:var(--text-dim)">${r.note}</td>
          </tr>`).join('')}
      </table>
    </div>
  `;
  document.getElementById('btnAgain').disabled = true;
  document.getElementById('btnGot').disabled = true;
  document.getElementById('queueInfo').textContent = '';
}

function renderCard(phrase) {
  const score = progress[phrase.id] || 0;
  if (!revealed) {
    document.getElementById('mainArea').innerHTML = `
      <div class="card" id="card" onclick="revealCard()">
        <div class="cat-badge">${phrase.cat}</div>
        ${renderScoreDots(score)}
        <div class="ja">${phrase.ja}</div>
        <div class="tap-hint">タップして読み方を確認</div>
      </div>`;
  } else {
    const wordsHtml = phrase.words.map((w, i) => `
      <div class="word-chip${activeWordIdx === i ? ' active' : ''}" onclick="toggleGloss(${i})">
        <span class="wkata">${w.kata}</span>
        <span class="wkn">${w.kn}</span>
      </div>`).join('');

    const glossHtml = activeWordIdx !== null ? `
      <div class="gloss-box">
        <div class="gloss-pos">${phrase.words[activeWordIdx].pos}</div>
        <div class="gloss-meaning">${phrase.words[activeWordIdx].gloss}</div>
      </div>` : '';

    document.getElementById('mainArea').innerHTML = `
      <div class="card">
        <div class="cat-badge">${phrase.cat}</div>
        ${renderScoreDots(score)}
        <div class="kata">${phrase.kata}</div>
        <div class="kn">${phrase.kn}</div>
        <div class="gr-tag">${phrase.gr}</div>
        <div class="word-breakdown">
          <h4>▼ 単語をタップすると品詞・意味が表示されます</h4>
          <div class="words-row" id="wordsRow">${wordsHtml}</div>
          <div id="glossArea">${glossHtml}</div>
        </div>
      </div>`;
  }
}

function toggleGloss(idx) {
  activeWordIdx = activeWordIdx === idx ? null : idx;
  renderCard(currentPhrase);
}

function revealCard() {
  if (revealed) return;
  revealed = true;
  activeWordIdx = null;
  document.getElementById('btnAgain').disabled = false;
  document.getElementById('btnGot').disabled = false;
  renderCard(currentPhrase);
}

function nextCard() {
  if (currentCat === '動詞ಇರu活用') { renderConjugationTable(); return; }
  revealed = false;
  activeWordIdx = null;
  currentPhrase = pickNextPhrase();
  document.getElementById('btnAgain').disabled = true;
  document.getElementById('btnGot').disabled = true;
  if (!currentPhrase) {
    document.getElementById('mainArea').innerHTML = `
      <div class="empty-state"><div class="big">🎉</div>このカテゴリのフレーズはありません</div>`;
    document.getElementById('queueInfo').textContent = '';
    return;
  }
  renderCard(currentPhrase);

  const pool = filteredPhrases();
  const remaining = pool.filter(p => (progress[p.id] || 0) < 5).length;
  document.getElementById('queueInfo').textContent = `残り未定着: ${remaining}フレーズ`;
}

// ─────────────────────────────────────────────
// BUTTONS
// ─────────────────────────────────────────────
document.getElementById('btnAgain').onclick = function() {
  const id = currentPhrase.id;
  progress[id] = Math.max(0, (progress[id] || 0) - 1);
  saveProgress();
  updateProgress();
  nextCard();
};

document.getElementById('btnGot').onclick = function() {
  const id = currentPhrase.id;
  progress[id] = Math.min(5, (progress[id] || 0) + 1);
  saveProgress();
  updateProgress();
  nextCard();
};

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
loadProgress();
buildTabs();
updateProgress();
nextCard();
</script>
