<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>二都の時 — India × Tokyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Shippori+Mincho+B1:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14121a;
  --paper:#f5efe4;
  --marigold:#e8a33d;
  --akane:#c93a32;
  --mist:rgba(245,239,228,.55);
  --line:rgba(245,239,228,.18);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);
  font-family:'Zen Kaku Gothic New',sans-serif;
  overflow:hidden;display:flex;flex-direction:column;height:100dvh;
}

/* ── header ── */
header{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 20px 8px;flex:0 0 auto;
}
header h1{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:clamp(15px,2.2vh,20px);letter-spacing:.35em}
header .sub{font-family:'Bodoni Moda',serif;font-size:clamp(9px,1.4vh,12px);letter-spacing:.28em;color:var(--mist);text-transform:uppercase}

/* ── layout ── */
main{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:1fr auto 1fr;padding:0 12px}
@media (orientation:landscape){main{grid-template-rows:none;grid-template-columns:1fr auto 1fr}}
.panel{
  position:relative;border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background 2s linear;min-height:0;min-width:0;
}
.panel .bgphoto{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}
.panel.has-photo .bgphoto{opacity:1}
.panel .veil{position:absolute;inset:0;background:rgba(16,13,20,0);transition:background .6s}
.panel.has-photo .veil{background:rgba(16,13,20,.45)}
.city{position:absolute;top:14px;left:18px;z-index:2;display:flex;flex-direction:column;gap:2px}
.city .en{font-family:'Bodoni Moda',serif;font-size:clamp(11px,1.8vh,14px);letter-spacing:.3em;text-transform:uppercase}
.city .ja{font-family:'Shippori Mincho B1',serif;font-size:clamp(10px,1.6vh,13px);letter-spacing:.2em;color:var(--mist)}
.city .accent{width:26px;height:2px;margin-top:5px}
#panel-blr .accent{background:var(--marigold)}
#panel-tyo .accent{background:var(--akane)}
.datestr{position:absolute;bottom:12px;left:18px;z-index:2;font-size:clamp(10px,1.6vh,13px);letter-spacing:.12em;color:var(--mist);font-weight:300}
.phase{position:absolute;bottom:12px;right:18px;z-index:2;font-family:'Shippori Mincho B1',serif;font-size:clamp(10px,1.6vh,13px);letter-spacing:.25em;color:var(--mist)}
.photo-btn{
  position:absolute;top:12px;right:14px;z-index:3;
  background:rgba(20,18,26,.4);border:1px solid var(--line);color:var(--paper);
  border-radius:999px;font-size:11px;letter-spacing:.1em;padding:6px 12px;cursor:pointer;
  font-family:inherit;backdrop-filter:blur(6px);
}
.photo-btn:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.clockwrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:34px 8px}

/* ── bridge ── */
.bridge{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0;z-index:2}
@media (orientation:landscape){.bridge{flex-direction:column;padding:0 10px;gap:10px}}
.bridge .rule{flex:0 0 auto;width:44px;height:1px;background:var(--line)}
@media (orientation:landscape){.bridge .rule{width:1px;height:44px}}
.bridge .diff{font-family:'Bodoni Moda',serif;font-size:12px;letter-spacing:.22em;color:var(--mist);white-space:nowrap}
@media (orientation:landscape){.bridge .diff{writing-mode:vertical-rl;letter-spacing:.3em}}

/* ══════════ DIGITAL STYLES ══════════ */
.dg{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.dg .main{font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.dg .sub{font-variant-numeric:tabular-nums;color:var(--mist);letter-spacing:.2em}
.dg-bodoni .main{font-family:'Bodoni Moda',serif;font-weight:600;font-size:clamp(44px,12.5vh,116px)}
.dg-bodoni .sub{font-family:'Bodoni Moda',serif;font-size:clamp(13px,2.4vh,20px)}
.dg-thin .main{font-family:'Zen Kaku Gothic New';font-weight:300;font-size:clamp(46px,13vh,120px);letter-spacing:.04em}
.dg-thin .sub{font-weight:300;font-size:clamp(11px,2vh,15px)}
.dg-neon .main{
  font-family:'Zen Kaku Gothic New';font-weight:300;font-size:clamp(44px,12vh,110px);color:#c7fbff;
  text-shadow:0 0 6px #7df3ff,0 0 18px #29d2e8,0 0 42px #0aa8c4;
}
.dg-neon .sub{color:#7df3ffaa;font-size:clamp(11px,2vh,14px);text-shadow:0 0 10px #29d2e8}
.dg-led{position:relative}
.dg-led .main{
  font-family:var(--mono);font-weight:700;font-style:italic;
  font-size:clamp(40px,11vh,104px);color:#ff4136;
  text-shadow:0 0 8px rgba(255,65,54,.8),0 0 26px rgba(255,65,54,.45);
}
.dg-led .ghost{position:absolute;top:0;left:0;font-family:var(--mono);font-weight:700;font-style:italic;font-size:clamp(40px,11vh,104px);color:rgba(255,65,54,.09);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dg-led .sub{color:rgba(255,120,110,.7);font-family:var(--mono);font-size:clamp(10px,1.8vh,14px)}
.dg-term{align-items:flex-start;text-align:left;font-family:var(--mono);text-shadow:none}
.dg-term .prompt{color:#5aef8a99;font-size:clamp(11px,2vh,15px);margin-bottom:6px}
.dg-term .main{color:#5aef8a;font-size:clamp(30px,7.5vh,72px);text-shadow:0 0 14px rgba(90,239,138,.35)}
.dg-term .main::after{content:"▊";animation:cur 1.1s step-end infinite;margin-left:.15em}
@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.dg-term .main::after{animation:none}}
.dg-mono .main{font-family:var(--mono);font-weight:400;font-size:clamp(38px,10.5vh,100px)}
.dg-mono .sub{font-family:var(--mono);font-size:clamp(11px,2vh,15px);letter-spacing:.1em}
.dg-ampm .main{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(46px,13vh,118px)}
.dg-ampm .main small{font-size:.32em;letter-spacing:.15em;color:var(--mist);margin-left:.25em;vertical-align:baseline}
.dg-ampm .sub{font-family:'Bodoni Moda',serif;font-size:clamp(12px,2.2vh,18px)}
.dg-vert .main{
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:'Shippori Mincho B1',serif;font-weight:600;
  font-size:clamp(26px,6.2vh,58px);letter-spacing:.18em;line-height:1.4;
}
.dg-sec .main{font-family:'Bodoni Moda',serif;font-weight:700;font-size:clamp(64px,17vh,170px)}
.dg-sec .sub{font-family:'Bodoni Moda',serif;font-size:clamp(15px,3vh,26px);letter-spacing:.3em}
.dg-stack .main{font-family:'Zen Kaku Gothic New';font-weight:700;font-size:clamp(52px,12vh,116px);line-height:.95}
.dg-stack .sub{font-size:clamp(11px,2vh,15px)}
.dg canvas{display:block}
/* flip */
.flip{display:flex;gap:.14em;align-items:center}
.flip .card{
  position:relative;width:clamp(36px,8.5vh,80px);height:clamp(54px,13vh,116px);
  border-radius:10px;background:#1d1a26;border:1px solid var(--line);
  font-family:'Bodoni Moda',serif;font-weight:700;font-size:clamp(32px,8vh,72px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;
}
@media (orientation:landscape){.flip .card{width:clamp(32px,10vw,80px);height:clamp(48px,15vw,116px);font-size:clamp(28px,9vw,72px)}}
.flip .card::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(20,18,26,.9)}
.flip .card.tickf{animation:flipTick .45s ease}
@keyframes flipTick{0%{transform:rotateX(0)}40%{transform:rotateX(-88deg)}100%{transform:rotateX(0)}}
@media (prefers-reduced-motion:reduce){.flip .card.tickf{animation:none}}
.flip .fcolon{font-family:'Bodoni Moda',serif;font-size:clamp(24px,5.5vh,50px);color:var(--mist);padding:0 .06em}

/* ══════════ ANALOG STYLES ══════════ */
.an{
  --size:min(66vw,32dvh,340px);
  --anfg:var(--paper);--anmute:var(--mist);--andial:radial-gradient(circle at 50% 42%,rgba(245,239,228,.08),rgba(245,239,228,.02) 70%);
  width:var(--size);height:var(--size);border-radius:50%;position:relative;
  border:1px solid var(--line);background:var(--andial);
  box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 0 0 6px rgba(20,18,26,.25);
}
@media (orientation:landscape){.an{--size:min(34vw,58dvh,340px)}}
.an .tick{position:absolute;left:50%;top:50%;width:2px;height:50%;transform-origin:top center}
.an .tick::after{content:"";position:absolute;bottom:5px;left:0;width:1.5px;height:9px;background:var(--anmute)}
.an .tick.h5::after{height:15px;width:3px;left:-.75px;background:var(--anfg)}
.an .dotm{position:absolute;left:50%;top:50%;width:2px;height:50%;transform-origin:top center}
.an .dotm::after{content:"";position:absolute;bottom:10px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--anmute)}
.an .num{
  position:absolute;transform:translate(-50%,-50%);
  font-size:calc(var(--size)*.085);color:var(--anfg);
  font-variant-numeric:tabular-nums;font-family:'Zen Kaku Gothic New';font-weight:400;
}
.an .hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:99px;background:var(--anfg)}
.an .h{width:5px;height:25%;margin-left:-2.5px}
.an .m{width:3px;height:37%;margin-left:-1.5px}
.an .s{width:1.5px;height:43%;margin-left:-.75px}
.an .pin{position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);background:var(--anfg);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.an .brand{position:absolute;left:50%;top:29%;transform:translateX(-50%);font-family:'Shippori Mincho B1',serif;font-size:calc(var(--size)*.045);letter-spacing:.3em;color:var(--anmute)}
.an .glyph{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);font-size:calc(var(--size)*.09);color:var(--anmute)}
/* dial variants */
.an-white{--anfg:#1c1a24;--anmute:#1c1a2488;--andial:radial-gradient(circle at 50% 40%,#fdfaf2,#e9e2d2 78%);border-color:#00000022}
.an-white .pin{box-shadow:0 0 0 3px #fdfaf2}
.an-cream{--anfg:#3b2f24;--anmute:#3b2f2477;--andial:radial-gradient(circle at 50% 38%,#f3e6c8,#d8c49a 80%);border-color:#3b2f2433}
.an-cream .num{font-family:'Bodoni Moda',serif;font-weight:600}
.an-cream .pin{box-shadow:0 0 0 3px #f3e6c8}
.an-neon{--anfg:#7df3ff;--anmute:#7df3ff77;--andial:radial-gradient(circle at 50% 45%,#07131a,#020608 75%);border:1.5px solid #29d2e8;box-shadow:0 0 24px rgba(41,210,232,.35), inset 0 0 22px rgba(41,210,232,.12)}
.an-neon .hand{box-shadow:0 0 8px rgba(125,243,255,.8)}
.an-roman .num{font-family:'Bodoni Moda',serif;font-weight:600;font-size:calc(var(--size)*.075)}
.an-kanji .num{font-family:'Shippori Mincho B1',serif;font-weight:600}
.an-station{--anfg:#16141d;--anmute:#16141d;--andial:radial-gradient(circle at 50% 42%,#ffffff,#e8e8ea 80%);border:calc(var(--size)*.03) solid #26232e}
.an-station .tick::after{width:3px;left:-.75px;height:11px}
.an-station .tick.h5::after{width:6px;left:-2.25px;height:18px}
.an-station .h{width:8px;margin-left:-4px}
.an-station .m{width:6px;margin-left:-3px}
.an-station .pin{box-shadow:none}
.an-skel .hand{background:transparent;border-left:1.5px solid var(--anfg);border-right:1.5px solid var(--anfg);border-top:1.5px solid var(--anfg);border-radius:4px 4px 0 0}
.an-skel .h{width:7px;margin-left:-3.5px;height:27%}
.an-skel .m{width:5px;margin-left:-2.5px;height:40%}
.an-24 .num{font-size:calc(var(--size)*.062);color:var(--anmute)}

/* ══════════ OTHER STYLES ══════════ */
.zen{text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.zen .big{font-family:'Shippori Mincho B1',serif;font-weight:400;font-size:clamp(38px,9vh,88px);letter-spacing:.08em;line-height:1.25}
.zen .small{margin-top:10px;font-weight:300;font-size:clamp(12px,2vh,16px);letter-spacing:.3em;color:var(--mist)}

.bin{display:flex;gap:clamp(8px,1.6vh,16px);align-items:flex-end}
.bin .col{display:flex;flex-direction:column;gap:clamp(5px,1vh,10px)}
.bin .b{width:clamp(14px,2.8vh,26px);height:clamp(14px,2.8vh,26px);border-radius:50%;border:1px solid var(--line);background:rgba(245,239,228,.06);transition:all .2s}
.bin .b.on{background:var(--paper);box-shadow:0 0 12px rgba(245,239,228,.5)}
.bin .lbl{font-family:var(--mono);font-size:10px;color:var(--mist);text-align:center;margin-top:4px}
.bin-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.bin-sub{font-family:var(--mono);font-size:clamp(11px,2vh,15px);color:var(--mist);font-variant-numeric:tabular-nums}

.prog{width:min(78%,420px);display:flex;flex-direction:column;gap:clamp(12px,2.6vh,22px)}
.prog .row{display:flex;flex-direction:column;gap:6px}
.prog .top{display:flex;justify-content:space-between;font-size:clamp(10px,1.8vh,13px);letter-spacing:.2em;color:var(--mist)}
.prog .top b{color:var(--paper);font-weight:500;font-variant-numeric:tabular-nums}
.prog .bar{height:4px;background:rgba(245,239,228,.12);border-radius:99px;overflow:hidden}
.prog .fill{height:100%;border-radius:99px;background:var(--paper);width:0%}

.ring{position:relative;width:min(60vw,30dvh,320px);height:min(60vw,30dvh,320px)}
@media (orientation:landscape){.ring{width:min(32vw,56dvh,320px);height:min(32vw,56dvh,320px)}}
.ring svg{width:100%;height:100%;display:block}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .ctr .t{font-family:'Bodoni Moda',serif;font-weight:600;font-size:clamp(28px,6.5vh,60px);font-variant-numeric:tabular-nums}
.ring .ctr .d{font-size:clamp(10px,1.8vh,13px);letter-spacing:.25em;color:var(--mist)}

.words{text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.35);max-width:88%}
.words .big{font-family:'Shippori Mincho B1',serif;font-size:clamp(24px,5.4vh,52px);line-height:1.5;font-weight:400}
.words.en .big{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:400}
.words .small{margin-top:12px;font-size:clamp(11px,2vh,15px);letter-spacing:.3em;color:var(--mist);font-variant-numeric:tabular-nums}

.iso{font-family:var(--mono);text-align:center}
.iso .main{font-size:clamp(16px,3.6vh,34px);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.iso .main .off{color:var(--mist)}
.iso .sub{margin-top:10px;font-size:clamp(10px,1.8vh,13px);color:var(--mist);letter-spacing:.15em}

.datebig{text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.datebig .day{font-family:'Bodoni Moda',serif;font-weight:700;font-size:clamp(64px,16vh,160px);line-height:1}
.datebig .mo{font-size:clamp(13px,2.6vh,20px);letter-spacing:.4em;color:var(--mist);margin-top:4px}
.datebig .tm{margin-top:10px;font-family:'Bodoni Moda',serif;font-size:clamp(16px,3.2vh,28px);font-variant-numeric:tabular-nums}

/* ── footer / picker ── */
footer{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:transparent;border:1px solid var(--line);color:var(--mist);
  border-radius:999px;width:36px;height:36px;font-size:14px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.nav-btn:focus-visible,.open-btn:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
.open-btn{
  background:var(--paper);color:var(--ink);border:none;border-radius:999px;
  padding:9px 22px;font-size:13px;letter-spacing:.12em;font-family:inherit;font-weight:500;cursor:pointer;
  max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.open-btn .cat{opacity:.55;font-size:11px;margin-right:8px}

.sheet-backdrop{
  position:fixed;inset:0;background:rgba(10,8,14,.55);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;
}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:#1b1824;border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:72dvh;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
body.sheet-open .sheet{transform:translateY(0)}
body.sheet-open .sheet-backdrop{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.sheet-backdrop{transition:none}}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;flex:0 0 auto}
.sheet .head h2{font-family:'Shippori Mincho B1',serif;font-size:15px;letter-spacing:.3em;font-weight:600}
.sheet .close{background:transparent;border:none;color:var(--mist);font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.1em;padding:6px}
.sheet .body{overflow-y:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch}
.sheet h3{
  font-size:11px;letter-spacing:.35em;color:var(--mist);font-weight:400;
  margin:18px 0 10px;display:flex;align-items:center;gap:10px;
}
.sheet h3::after{content:"";flex:1;height:1px;background:var(--line)}
.stygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.sty{
  background:rgba(245,239,228,.04);border:1px solid var(--line);color:var(--paper);
  border-radius:12px;padding:12px 8px;font-size:12.5px;letter-spacing:.06em;
  font-family:inherit;cursor:pointer;transition:all .2s;text-align:center;line-height:1.3;
}
.sty small{display:block;margin-top:3px;font-size:9.5px;color:var(--mist);letter-spacing:.12em}
.sty[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:500}
.sty[aria-pressed="true"] small{color:#14121a99}
.sty:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}
input[type=file]{display:none}
@media (max-height:420px) and (orientation:landscape){
  header{padding-top:6px;padding-bottom:2px}
  .datestr,.phase{display:none}
}
</style>
</head>
<body>

<header>
  <h1>二都の時</h1>
  <div class="sub">India · Tokyo</div>
</header>

<main>
  <section class="panel" id="panel-blr">
    <div class="bgphoto" id="bg-blr"></div>
    <div class="veil"></div>
    <div class="city"><span class="en">India</span><span class="ja">インド</span><span class="accent"></span></div>
    <button class="photo-btn" id="btn-photo-blr">写真</button>
    <div class="clockwrap" id="clock-blr"></div>
    <div class="datestr" id="date-blr"></div>
    <div class="phase" id="phase-blr"></div>
  </section>

  <div class="bridge">
    <span class="rule"></span>
    <span class="diff">時差 3:30 — 日本が先行</span>
    <span class="rule"></span>
  </div>

  <section class="panel" id="panel-tyo">
    <div class="bgphoto" id="bg-tyo"></div>
    <div class="veil"></div>
    <div class="city"><span class="en">Tokyo</span><span class="ja">東京</span><span class="accent"></span></div>
    <button class="photo-btn" id="btn-photo-tyo">写真</button>
    <div class="clockwrap" id="clock-tyo"></div>
    <div class="datestr" id="date-tyo"></div>

<script>
(function(){
"use strict";

/* ── storage ── */
const mem={};
const store={
  get(k){try{return localStorage.getItem(k)??mem[k]??null}catch(e){return mem[k]??null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};

/* ── timezone engine (オフセットをキャッシュして高速化) ── */
const offsets={};
function calcOffset(tz){
  const now=Date.now();
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date(now));
  const o={};for(const p of parts)o[p.type]=p.value;
  const wallUTC=Date.UTC(+o.year,+o.month-1,+o.day,(+o.hour)%24,+o.minute,+o.second,now%1000);
  offsets[tz]=wallUTC-now;
}
function refreshOffsets(){calcOffset('Asia/Kolkata');calcOffset('Asia/Tokyo')}
refreshOffsets();
setInterval(refreshOffsets,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshOffsets()});
const WD=['日','月','火','水','木','金','土'];
const WDEN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MOEN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function tzNow(tz){
  const w=new Date(Date.now()+(offsets[tz]||0));
  return {h:w.getUTCHours(),m:w.getUTCMinutes(),s:w.getUTCSeconds(),ms:w.getUTCMilliseconds(),
          y:w.getUTCFullYear(),mo:w.getUTCMonth()+1,d:w.getUTCDate(),wd:w.getUTCDay()};
}
const p2=n=>String(n).padStart(2,'0');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── day phase ── */
function phaseOf(h){
  if(h>=5&&h<7)  return{name:'黎明',g:'linear-gradient(165deg,#2b2440 0%,#5b3a5e 45%,#c96f4a 100%)'};
  if(h>=7&&h<10) return{name:'朝',g:'linear-gradient(165deg,#3a5a7d 0%,#6f93ae 55%,#e8c98f 100%)'};
  if(h>=10&&h<16)return{name:'昼',g:'linear-gradient(165deg,#3f6f96 0%,#5e8fb0 60%,#a8c3cf 100%)'};
  if(h>=16&&h<18)return{name:'夕暮',g:'linear-gradient(165deg,#43395f 0%,#96495a 55%,#e8a33d 100%)'};
  if(h>=18&&h<20)return{name:'宵',g:'linear-gradient(165deg,#221d38 0%,#4a3457 60%,#8c4a52 100%)'};
  return{name:'夜',g:'linear-gradient(165deg,#0e0c16 0%,#1c1830 55%,#2c2447 100%)'};
}

/* ── kanji helpers ── */
const KJ=['〇','一','二','三','四','五','六','七','八','九'];
function kanjiNum(n){
  if(n===0)return'〇';
  let s='';const t=Math.floor(n/10),o=n%10;
  if(t>=2)s+=KJ[t]; if(t>=1)s+='十'; if(o>0)s+=KJ[o];
  return s;
}
const ROMAN=['','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI','XII'];
const FW='０１２３４５６７８９';
const fw=str=>String(str).replace(/[0-9]/g,c=>FW[+c]).replace(/:/g,'：');

/* ══════════ DIGITAL FACTORY ══════════ */
function digital(cls,fmt,opts){
  opts=opts||{};
  return{
    build(el,ctx){
      let inner='';
      if(opts.prompt)inner+=`<div class="prompt">nari@${ctx.key} ~ % date</div>`;
      if(opts.ghost)inner+=`<div class="ghost">88:88:88</div>`;
      inner+=`<div class="main"></div><div class="sub"></div>`;
      el.innerHTML=`<div class="dg ${cls}">${inner}</div>`;
    },
    upd(el,t,ctx){
      const r=fmt(t,ctx);
      const m=el.querySelector('.main'),s=el.querySelector('.sub');
      if(m.dataset.v!==r.main){m.dataset.v=r.main;if(r.html)m.innerHTML=r.main;else m.textContent=r.main}
      const sv=r.sub||'';
      if(s.dataset.v!==sv){s.dataset.v=sv;s.textContent=sv}
    }
  };
}
const dateJa=t=>`${t.y}年${t.mo}月${t.d}日（${WD[t.wd]}）`;
const dateEn=t=>`${WDEN[t.wd]}, ${MOEN[t.mo-1]} ${t.d}`;

/* ══════════ DOT MATRIX ══════════ */
const DOTF={
 '0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],
 '3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],
 '6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],
 '9':[14,17,17,15,1,2,12],':':[0,4,0,0,4,0,0]
};
const dotStyle={
  build(el,ctx){
    el.innerHTML='<div class="dg"><canvas></canvas><div class="sub"></div></div>';
    const c=el.querySelector('canvas');
    c._resize=()=>{
      const w=Math.min(el.clientWidth*.86,560),cell=Math.max(4,Math.floor(w/43));
      c.width=43*cell*devicePixelRatio;c.height=7*cell*devicePixelRatio;
      c.style.width=(43*cell)+'px';c.style.height=(7*cell)+'px';
      c._cell=cell*devicePixelRatio;c._last='';
    };
    c._resize();
  },
  upd(el,t,ctx){
    const c=el.querySelector('canvas');if(!c)return;
    const str=`${p2(t.h)}:${p2(t.m)}:${p2(t.s)}`;
    if(c._last===str)return;c._last=str;
    const g=c.getContext('2d'),cell=c._cell;
    g.clearRect(0,0,c.width,c.height);
    let x=0;
    for(const ch of str){
      const bmp=DOTF[ch],w=ch===':'?3:5;
      for(let r=0;r<7;r++)for(let col=0;col<w;col++){
        const on=(bmp[r]>>(4-col))&1;
        g.fillStyle=on?ctx.accent:'rgba(245,239,228,.07)';
        g.beginPath();
        g.arc((x+col)*cell+cell/2,r*cell+cell/2,cell*.36,0,7);
        g.fill();
      }
      x+=w+1;
    }
    const sub=el.querySelector('.sub');
    if(sub.textContent!==dateJa(t))sub.textContent=dateJa(t);
  }
};

/* ══════════ FLIP ══════════ */
const flipStyle={
  build(el){
    el.innerHTML=`<div class="dg"><div class="flip">
      <div class="card fh1">0</div><div class="card fh2">0</div>
      <span class="fcolon">:</span>
      <div class="card fm1">0</div><div class="card fm2">0</div>
    </div><div class="sub"></div></div>`;
  },
  upd(el,t){
    const hh=p2(t.h),mm=p2(t.m);
    [['fh1',hh[0]],['fh2',hh[1]],['fm1',mm[0]],['fm2',mm[1]]].forEach(([cls,v])=>{
      const c=el.querySelector('.'+cls);
      if(c.textContent!==v){
        c.textContent=v;
        c.classList.remove('tickf');void c.offsetWidth;c.classList.add('tickf');
      }
    });
    const s=el.querySelector('.sub'),sv=dateJa(t);
    if(s.textContent!==sv)s.textContent=sv;
  }
};

/* ══════════ ANALOG FACTORY ══════════ */
function analog(cfg){
  return{
    build(el,ctx){
      let inner='';
      if(cfg.markers==='lines'||cfg.markers===undefined){
        for(let i=0;i<60;i++)inner+=`<div class="tick ${i%5===0?'h5':''}" style="transform:rotate(${i*6}deg)"></div>`;
      }else if(cfg.markers==='dots'){
        for(let i=0;i<12;i++)inner+=`<div class="dotm" style="transform:rotate(${i*30}deg)"></div>`;
      }
      if(cfg.numerals){
        const n=cfg.numerals==='24'?24:12,step=cfg.numerals==='24'?2:1;
        for(let i=step;i<=n;i+=step){
          const ang=(i/n)*Math.PI*2,r=cfg.numerals==='24'?40:38;
          const x=50+r*Math.sin(ang),y=50-r*Math.cos(ang);
          let lbl=i;
          if(cfg.numerals==='roman')lbl=ROMAN[i];
          if(cfg.numerals==='kanji')lbl=kanjiNum(i);
          inner+=`<div class="num" style="left:${x}%;top:${y}%">${lbl}</div>`;
        }
      }
      if(cfg.brand!==false)inner+=`<div class="brand">${ctx.brand}</div>`;
      if(cfg.glyph)inner+=`<div class="glyph"></div>`;
      inner+=`<div class="hand h"></div><div class="hand m"></div>`;
      if(cfg.sec!=='none')inner+=`<div class="hand s"></div>`;
      inner+=`<div class="pin"></div>`;
      el.innerHTML=`<div class="an ${cfg.cls||''}">${inner}</div>`;
      const s=el.querySelector('.s');
      if(s){
        if(cfg.sec==='red')s.style.background='#d0342c';
        else if(cfg.sec==='accent'||cfg.sec===undefined)s.style.background=ctx.accent;
      }
    },
    upd(el,t){
      const sec=t.s+(reduceMotion?0:t.ms/1000);
      const min=t.m+sec/60;
      const hr=cfg.numerals==='24'?(t.h+min/60)*15:((t.h%12)+min/60)*30;
      el.querySelector('.h').style.transform=`rotate(${hr}deg)`;
      el.querySelector('.m').style.transform=`rotate(${min*6}deg)`;
      const s=el.querySelector('.s');
      if(s)s.style.transform=`rotate(${sec*6}deg)`;
      if(cfg.glyph){
        const g=el.querySelector('.glyph'),v=(t.h>=6&&t.h<18)?'☀':'☾';
        if(g.textContent!==v)g.textContent=v;
      }
    },
    smooth:true
  };
}

/* ══════════ OTHER STYLES ══════════ */
const zenStyle={
  build(el){el.innerHTML='<div class="zen"><div class="big"></div><div class="small"></div></div>'},
  upd(el,t){
    const b=`${kanjiNum(t.h)}時${kanjiNum(t.m)}分`;
    const big=el.querySelector('.big');
    if(big.textContent!==b)big.textContent=b;
    const s=`${t.mo}月${t.d}日 ${WD[t.wd]}曜日`;
    const sm=el.querySelector('.small');
    if(sm.textContent!==s)sm.textContent=s;
  }
};

const BINCOLS=[['H',2],['H',4],['M',3],['M',4],['S',3],['S',4]];
const binStyle={
  build(el){
    let cols='';
    BINCOLS.forEach(([lbl,bits],i)=>{
      let dots='';for(let b=0;b<bits;b++)dots+='<div class="b"></div>';
      cols+=`<div class="col" data-i="${i}">${dots}<div class="lbl">${lbl}</div></div>`;
    });
    el.innerHTML=`<div class="bin-wrap"><div class="bin">${cols}</div><div class="bin-sub"></div></div>`;
  },
  upd(el,t){
    const vals=[Math.floor(t.h/10),t.h%10,Math.floor(t.m/10),t.m%10,Math.floor(t.s/10),t.s%10];
    el.querySelectorAll('.col').forEach(col=>{
      const v=vals[+col.dataset.i],dots=col.querySelectorAll('.b'),n=dots.length;
      dots.forEach((d,idx)=>{
        const bit=(v>>(n-1-idx))&1;
        d.classList.toggle('on',!!bit);
      });
    });
    const sub=el.querySelector('.bin-sub'),str=`${p2(t.h)}:${p2(t.m)}:${p2(t.s)}`;
    if(sub.textContent!==str)sub.textContent=str;
  }
};

const progStyle={
  build(el){
    const rows=['時','分','秒'].map(l=>`<div class="row"><div class="top"><span>${l}</span><b></b></div><div class="bar"><div class="fill"></div></div></div>`).join('');
    el.innerHTML=`<div class="prog">${rows}</div>`;
  },
  upd(el,t,ctx){
    const data=[[t.h,24,`${p2(t.h)} / 24`],[t.m,60,`${p2(t.m)} / 60`],[t.s,60,`${p2(t.s)} / 60`]];
    el.querySelectorAll('.row').forEach((row,i)=>{
      const [v,max,lbl]=data[i];
      row.querySelector('.fill').style.width=(v/max*100)+'%';
      row.querySelector('.fill').style.background=i===2?ctx.accent:'var(--paper)';
      const b=row.querySelector('b');
      if(b.textContent!==lbl)b.textContent=lbl;
    });
  }
};

const ringStyle={
  build(el,ctx){
    let dots='';
    for(let i=0;i<60;i++){
      const a=i/60*Math.PI*2,x=50+44*Math.sin(a),y=50-44*Math.cos(a);
      dots+=`<circle cx="${x}" cy="${y}" r="${i%5===0?1.9:1.2}" data-i="${i}" fill="rgba(245,239,228,.15)"/>`;
    }
    el.innerHTML=`<div class="ring"><svg viewBox="0 0 100 100">${dots}</svg><div class="ctr"><div class="t"></div><div class="d"></div></div></div>`;
    el.querySelector('.ring')._accent=ctx.accent;
  },
  upd(el,t,ctx){
    const svg=el.querySelector('svg');if(!svg)return;
    if(svg._s!==t.s){
      svg._s=t.s;
      svg.querySelectorAll('circle').forEach(c=>{
        c.setAttribute('fill',+c.dataset.i<=t.s?ctx.accent:'rgba(245,239,228,.15)');
      });
    }
    const tt=el.querySelector('.t'),str=`${p2(t.h)}:${p2(t.m)}`;
    if(tt.textContent!==str)tt.textContent=str;
    const d=el.querySelector('.d'),ds=`${t.mo}.${p2(t.d)} ${WD[t.wd]}`;
    if(d.textContent!==ds)d.textContent=ds;
  }
};

function wordsJa(t){
  const per=t.h<12?'午前':'午後';
  let h12=t.h%12;if(h12===0)h12=12;
  let m=Math.round(t.m/5)*5,hh=h12,suffix='ごろ';
  if(m===60){m=0;hh=h12===12?1:h12+1}
  let mtxt;
  if(m===0)mtxt='ちょうど';
  else if(m===30)mtxt='半';
  else mtxt=kanjiNum(m)+'分';
  if(m===0&&t.m<=1)suffix='';
  return `${per}${kanjiNum(hh)}時${mtxt==='ちょうど'?'':mtxt}${mtxt==='ちょうど'?'ちょうど':suffix}`;
}
const wordsJaStyle={
  build(el){el.innerHTML='<div class="words"><div class="big"></div><div class="small"></div></div>'},
  upd(el,t){
    const b=el.querySelector('.big'),v=wordsJa(t);
    if(b.textContent!==v)b.textContent=v;
    const s=el.querySelector('.small'),sv=`${p2(t.h)}:${p2(t.m)}`;
    if(s.textContent!==sv)s.textContent=sv;
  }
};

const NUMEN=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'];
const MINEN={0:"o'clock",5:'five past',10:'ten past',15:'quarter past',20:'twenty past',25:'twenty-five past',30:'half past',35:'twenty-five to',40:'twenty to',45:'quarter to',50:'ten to',55:'five to'};
function wordsEn(t){
  let m=Math.round(t.m/5)*5,h=t.h;
  if(m===60){m=0;h=(h+1)%24}
  let hw=h%12;
  if(m>30)hw=(hw+1)%12;
  const hword=NUMEN[hw]||'twelve';
  const per=h<5?'at night':h<12?'in the morning':h<17?'in the afternoon':h<21?'in the evening':'at night';
  if(m===0)return `${hword} ${MINEN[0]} ${per}`;
  return `${MINEN[m]} ${hword} ${per}`;
}
const wordsEnStyle={
  build(el){el.innerHTML='<div class="words en"><div class="big"></div><div class="small"></div></div>'},
  upd(el,t){
    const b=el.querySelector('.big'),v=wordsEn(t);
    if(b.textContent!==v)b.textContent=v;
    const s=el.querySelector('.small'),sv=`${p2(t.h)}:${p2(t.m)}`;
    if(s.textContent!==sv)s.textContent=sv;
  }
};

const isoStyle={
  build(el){el.innerHTML='<div class="iso"><div class="main"></div><div class="sub"></div></div>'},
  upd(el,t,ctx){
    const m=el.querySelector('.main');
    const str=`${t.y}-${p2(t.mo)}-${p2(t.d)}T${p2(t.h)}:${p2(t.m)}:${p2(t.s)}`;
    const html=`${str}<span class="off">${ctx.off}</span>`;
    if(m.dataset.v!==html){m.dataset.v=html;m.innerHTML=html}
    const s=el.querySelector('.sub'),sv=`unix ${Math.floor(Date.now()/1000)}`;
    if(s.textContent!==sv)s.textContent=sv;
  }
};

const dateBigStyle={
  build(el){el.innerHTML='<div class="datebig"><div class="day"></div><div class="mo"></div><div class="tm"></div></div>'},
  upd(el,t){
    const d=el.querySelector('.day'),dv=String(t.d);
    if(d.textContent!==dv)d.textContent=dv;
    const mo=el.querySelector('.mo'),mv=`${MOEN[t.mo-1].toUpperCase()} · ${WD[t.wd]}曜日`;
    if(mo.textContent!==mv)mo.textContent=mv;
    const tm=el.querySelector('.tm'),tv=`${p2(t.h)}:${p2(t.m)}`;
    if(tm.textContent!==tv)tm.textContent=tv;
  }
};

/* ══════════ STYLE REGISTRY (30種) ══════════ */
const STYLES=[

 /* その他 (8) */
 {id:'o-zen',cat:'その他',name:'禅',sub:'漢数字',r:zenStyle},
 {id:'o-words-ja',cat:'その他',name:'ことば',sub:'日本語',r:wordsJaStyle},
 {id:'o-words-en',cat:'その他',name:'Words',sub:'English',r:wordsEnStyle},
 {id:'o-bin',cat:'その他',name:'二進数',sub:'Binary',r:binStyle},
 {id:'o-prog',cat:'その他',name:'プログレス',sub:'Bars',r:progStyle},
 {id:'o-ring',cat:'その他',name:'秒の輪',sub:'Ring',r:ringStyle},
 {id:'o-iso',cat:'その他',name:'ISO 8601',sub:'Engineer',r:isoStyle},
 {id:'o-date',cat:'その他',name:'日付メイン',sub:'Calendar',r:dateBigStyle},
];
const byId={};STYLES.forEach(s=>byId[s.id]=s);

/* ── panels ── */
const panels=[
 {key:'blr',tz:'Asia/Kolkata',brand:'IND',accent:'#e8a33d',off:'+05:30',
  el:document.getElementById('panel-blr'),clock:document.getElementById('clock-blr'),
  date:document.getElementById('date-blr'),phase:document.getElementById('phase-blr'),
  bg:document.getElementById('bg-blr'),lastPhase:''},
 {key:'tyo',tz:'Asia/Tokyo',brand:'TYO',accent:'#c93a32',off:'+09:00',
  el:document.getElementById('panel-tyo'),clock:document.getElementById('clock-tyo'),
  date:document.getElementById('date-tyo'),phase:document.getElementById('phase-tyo'),
  bg:document.getElementById('bg-tyo'),lastPhase:''}
];

let current=store.get('dualclock.style');
if(!byId[current])current='d-bodoni';

function applyStyle(id){
  current=id;store.set('dualclock.style',id);
  const st=byId[id];
  panels.forEach(p=>st.r.build(p.clock,p));
  const btn=document.getElementById('open-sheet');
  btn.querySelector('.cat').textContent=st.cat;
  btn.querySelector('.name').textContent=st.name;
  document.querySelectorAll('.sty').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id?'true':'false'));
  tick(true);
}

/* ── tick loop ── */
function tick(force){
  const st=byId[current];
  panels.forEach(p=>{
    const t=tzNow(p.tz);
    st.r.upd(p.clock,t,p);
    const ds=`${t.y}.${p2(t.mo)}.${p2(t.d)} ${WD[t.wd]}`;
    if(force||p.date.textContent!==ds)p.date.textContent=ds;
    const ph=phaseOf(t.h);
    if(force||p.lastPhase!==ph.name){
      p.lastPhase=ph.name;p.phase.textContent=ph.name;
      if(!p.el.classList.contains('has-photo'))p.el.style.background=ph.g;
    }
  });
}
setInterval(tick,250);
(function raf(){
  const st=byId[current];
  if(st&&st.r.smooth&&!reduceMotion&&!document.hidden)tick();
  requestAnimationFrame(raf);
})();

/* ── picker sheet ── */
const body=document.getElementById('sheet-body');
['デジタル','アナログ','その他'].forEach(cat=>{
  const h=document.createElement('h3');h.textContent=cat;body.appendChild(h);
  const grid=document.createElement('div');grid.className='stygrid';
  STYLES.filter(s=>s.cat===cat).forEach(s=>{
    const b=document.createElement('button');
    b.className='sty';b.dataset.id=s.id;
    b.innerHTML=`${s.name}<small>${s.sub}</small>`;
    b.addEventListener('click',()=>applyStyle(s.id));
    grid.appendChild(b);
  });
  body.appendChild(grid);
});
const openBtn=document.getElementById('open-sheet');
function openSheet(){document.body.classList.add('sheet-open')}
function closeSheet(){document.body.classList.remove('sheet-open')}
openBtn.addEventListener('click',openSheet);
document.getElementById('close-sheet').addEventListener('click',closeSheet);
document.getElementById('backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

document.getElementById('prev').addEventListener('click',()=>{
  const i=STYLES.findIndex(s=>s.id===current);
  applyStyle(STYLES[(i-1+STYLES.length)%STYLES.length].id);
});
document.getElementById('next').addEventListener('click',()=>{
  const i=STYLES.findIndex(s=>s.id===current);
  applyStyle(STYLES[(i+1)%STYLES.length].id);
});

/* ── photos ── */
function setPhoto(p,dataUrl){
  if(dataUrl){
    p.bg.style.backgroundImage=`url(${dataUrl})`;
    p.el.classList.add('has-photo');
    p.el.style.background='var(--ink)';
    document.getElementById('btn-photo-'+p.key).textContent='写真を消す';
  }else{
    p.bg.style.backgroundImage='';
    p.el.classList.remove('has-photo');
    p.lastPhase='';
    document.getElementById('btn-photo-'+p.key).textContent='写真';
    tick(true);
  }
}
panels.forEach(p=>{
  const saved=store.get('dualclock.photo.'+p.key);
  if(saved)setPhoto(p,saved);
  const btn=document.getElementById('btn-photo-'+p.key);
  const input=document.getElementById('file-'+p.key);
  btn.addEventListener('click',()=>{
    if(p.el.classList.contains('has-photo')){
      store.del('dualclock.photo.'+p.key);setPhoto(p,null);
    }else input.click();
  });
  input.addEventListener('change',()=>{
    const f=input.files&&input.files[0];if(!f)return;
    const img=new Image(),url=URL.createObjectURL(f);
    img.onload=()=>{
      const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',.78);
      URL.revokeObjectURL(url);
      store.set('dualclock.photo.'+p.key,dataUrl);
      setPhoto(p,dataUrl);input.value='';
    };
    img.onerror=()=>{URL.revokeObjectURL(url);input.value=''};
    img.src=url;
  });
});

/* dot matrix: リサイズ対応 */
addEventListener('resize',()=>{
  document.querySelectorAll('.dg canvas').forEach(c=>{if(c._resize){c._resize();}});
  tick(true);
});

applyStyle(current);
})();
</script>
